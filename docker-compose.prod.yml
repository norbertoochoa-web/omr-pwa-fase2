services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-omr_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-omr_pass}
      POSTGRES_DB: ${POSTGRES_DB:-omr_pwa}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-omr_user} -d ${POSTGRES_DB:-omr_pwa}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - BUILDKIT_INLINE_CACHE=1
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      POSTGRES_HOST: db
      DEBUG: "false"
    volumes:
      - uploads_data:/app/uploads
      - /var/omr/data:/var/omr/data
    command: >
      sh -c "python -m app.seed &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 4"
    restart: unless-stopped

volumes:
  pgdata:
  uploads_data:
